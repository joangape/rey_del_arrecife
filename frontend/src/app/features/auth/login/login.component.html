<div class="login-wrapper">
  <!-- Fondo decorativo con efectos marinos -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <main class="login-card" role="main">
    <!-- Encabezado de Marca -->
    <header class="card-header">
      <div class="brand-badge" aria-hidden="true">
        <svg class="reef-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Icono de arrecife / vida marina -->
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <h1 class="brand-title">Rey del Arrecife</h1>
      <p class="brand-subtitle">Plataforma de Control de Inventario y Especies</p>
    </header>

    <!-- Banner de Notificación de Error -->
    @if (activeError(); as errorMsg) {
      <div class="error-banner" role="alert" aria-live="assertive">
        <div class="error-content">
          <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span class="error-text">{{ errorMsg }}</span>
        </div>
        <button
          type="button"
          class="error-dismiss"
          (click)="clearError()"
          aria-label="Cerrar notificación de error"
        >
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    }

    <!-- Formulario de Acceso por Usuario y Contraseña -->
    <form class="login-form" (submit)="onLoginWithPassword($event)">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="login-email" class="form-label">Correo electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
          <input
            id="login-email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="socio@reydelarrecife.local"
            class="form-input"
            [disabled]="authService.isLoading()"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="login-password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
          </svg>
          <input
            id="login-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            required
            autocomplete="current-password"
            placeholder="••••••••••••"
            class="form-input has-toggle"
            [disabled]="authService.isLoading()"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            @if (showPassword()) {
              <!-- Eye Slash Icon -->
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
              </svg>
            } @else {
              <!-- Eye Icon -->
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Botón de Envío -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="authService.isLoading()"
      >
        @if (authService.isLoading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <!-- Separador -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">o continúa con</span>
      <span class="divider-line"></span>
    </div>

    <!-- Botón Google OAuth2 -->
    <button
      type="button"
      class="google-login-btn"
      [disabled]="authService.isLoading()"
      (click)="onLoginWithGoogle()"
    >
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 10.02 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span>Acceder con Google</span>
    </button>

    <!-- Accesos Rápidos de Desarrollo -->
    <div class="demo-helpers">
      <span class="demo-title">Accesos de demostración:</span>
      <div class="demo-buttons">
        <button
          type="button"
          class="demo-chip admin"
          (click)="fillDemoCredentials('admin')"
          [disabled]="authService.isLoading()"
          title="Rellenar credenciales de Administrador"
        >
          👑 Admin Demo
        </button>
        <button
          type="button"
          class="demo-chip partner"
          (click)="fillDemoCredentials('partner')"
          [disabled]="authService.isLoading()"
          title="Rellenar credenciales de Socio Colaborador"
        >
          🐠 Socio Demo
        </button>
      </div>
    </div>
  </main>
</div>
