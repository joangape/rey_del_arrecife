version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: rey-arrecife-pocketbase
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb_data
      - ../backend/pb_hooks:/pb_hooks:ro
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
    networks:
      - arrecife_net

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: rey-arrecife-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:80"
    depends_on:
      - pocketbase
    networks:
      - arrecife_net

networks:
  arrecife_net:
    name: rey_del_arrecife_network
    driver: bridge
